[package]
name = "mmore"
version = "0.4.0"
edition = "2024"
description = "A pager like more, with Markdown rendering and syntax highlighting"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/houseofmackee/mmore"
keywords = ["pager", "more", "markdown", "terminal", "syntax-highlighting"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
regex = "1.13.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2.3"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"

[build-dependencies]
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

# The build script compiles the syntax bundle; optimizing it keeps builds fast.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
