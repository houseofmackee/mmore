[package]
name = "mmore"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2.3"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
